<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="The reply button writes only when the ID names exactly 1 question block with 1 &quot;własnymi słowami&quot; item and 1 answer field. Otherwise the page stays as it was.">
<rect width="960" height="286" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">The reply button writes only when the ID names exactly 1 question block</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">with 1 "własnymi słowami" item and 1 answer field. Otherwise the page stays as it was.</text>
<polyline points="230,114 254,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,114 492,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,114 730,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,171 599,171 599,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="84" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="93" fill="#111111" font-weight="bold">Question block</text>
<text x="24" y="110" fill="#111111">### &lt;ID&gt; heading,</text>
<text x="24" y="127" fill="#111111">"własnymi słowami" item,</text>
<text x="24" y="144" fill="#111111">"&gt; " answer field</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="93" fill="#111111" font-weight="bold">Reply button</text>
<text x="262" y="110" fill="#111111">odp(id) draws it when</text>
<text x="262" y="127" fill="#111111">Space Lua is loaded;</text>
<text x="262" y="144" fill="#111111">otherwise no button</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="93" fill="#111111" font-weight="bold">Prompt</text>
<text x="500" y="110" fill="#111111">editor.prompt asks</text>
<text x="500" y="127" fill="#111111">for the answer;</text>
<text x="500" y="144" fill="#111111">empty: no change</text>
<rect x="730" y="72" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="738" y="93" fill="#c8102e" font-weight="bold">odpWstaw</text>
<text x="738" y="110" fill="#111111">1 heading with the ID,</text>
<text x="738" y="127" fill="#111111">1 item and 1 answer</text>
<text x="738" y="144" fill="#111111">field in that block</text>
<rect x="492" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="215.5" fill="#111111" font-weight="bold">Refuse</text>
<text x="500" y="232.5" fill="#111111">error notification,</text>
<text x="500" y="249.5" fill="#111111">page unchanged</text>
<rect x="730" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="207" fill="#111111" font-weight="bold">Save</text>
<text x="738" y="224" fill="#111111">tick the item, write</text>
<text x="738" y="241" fill="#111111">"&gt; answer", setText,</text>
<text x="738" y="258" fill="#111111">save, notify</text>
</svg>
