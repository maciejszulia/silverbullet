<text x="738" y="110" fill="#111111">1 nagłówek z ID,</text>
<text x="738" y="127" fill="#111111">1 pozycja i 1 pole</text>
<text x="738" y="144" fill="#111111">odpowiedzi w bloku</text>
<rect x="492" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="215.5" fill="#111111" font-weight="bold">Odmowa</text>
<text x="500" y="232.5" fill="#111111">powiadomienie o błędzie,</text>
<text x="500" y="249.5" fill="#111111">strona bez zmian</text>
<rect x="730" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="207" fill="#111111" font-weight="bold">Zapis</text>
