<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="Przycisk zapisuje odpowiedź tylko wtedy, gdy ID wskazuje dokładnie 1 blok pytania z 1 pozycją „własnymi słowami” i 1 polem odpowiedzi. Inaczej strona zostaje bez zmian.">
