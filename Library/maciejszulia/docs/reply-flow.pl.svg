<polyline points="468,114 492,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,114 730,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,171 599,171 599,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="84" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="93" fill="#111111" font-weight="bold">Blok pytania</text>
<text x="24" y="110" fill="#111111">nagłówek ### &lt;ID&gt;,</text>
<text x="24" y="127" fill="#111111">„własnymi słowami”,</text>
<text x="24" y="144" fill="#111111">pole odpowiedzi „&gt; ”</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="93" fill="#111111" font-weight="bold">Przycisk „Odpowiedz”</text>
<text x="262" y="110" fill="#111111">odp(id) rysuje przycisk,</text>
<text x="262" y="127" fill="#111111">gdy Space Lua działa;</text>
<text x="262" y="144" fill="#111111">inaczej brak przycisku</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="93" fill="#111111" font-weight="bold">Okno editor.prompt</text>
<text x="500" y="110" fill="#111111">użytkownik wpisuje</text>
<text x="500" y="127" fill="#111111">odpowiedź; pusta</text>
<text x="500" y="144" fill="#111111">odpowiedź: bez zmian</text>
<rect x="730" y="72" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
