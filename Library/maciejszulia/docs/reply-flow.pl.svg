<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">Przycisk zapisuje odpowiedź tylko wtedy, gdy ID wskazuje dokładnie 1 blok pytania</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">z 1 pozycją „własnymi słowami” i 1 polem odpowiedzi. Inaczej strona zostaje bez zmian.</text>
